# Local development database. Port 5433 avoids clashing with any Postgres already on 5432.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: trailguard
      POSTGRES_PASSWORD: trailguard
      POSTGRES_DB: trailguard
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trailguard"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
