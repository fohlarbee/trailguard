[project]
name = "trailguard"
version = "0.1.0"
description = "Cross-bank fraud tracing: simulator, core services and agent"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.1",
    "fastapi>=0.163.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.12",
    "scikit-learn>=1.5",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
